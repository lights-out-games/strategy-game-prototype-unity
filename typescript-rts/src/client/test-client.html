<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hexagonal RTS - Game Client</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #333;
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            color: #4a5568;
            margin-bottom: 30px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
        }

        .game-board {
            width: 600px;
            height: 600px;
            border: 3px solid #4a5568;
            margin: 20px auto;
            background: #f7fafc;
            position: relative;
            border-radius: 10px;
            overflow: hidden;
        }

        .hex-grid {
            width: 100%;
            height: 100%;
            background-image:
                radial-gradient(circle at 50% 50%, #e2e8f0 2px, transparent 2px);
            background-size: 30px 26px;
            background-position: 15px 13px;
        }

        .controls {
            display: flex;
            gap: 20px;
            margin: 20px 0;
            flex-wrap: wrap;
        }

        .panel {
            flex: 1;
            min-width: 300px;
            background: #f8f9fa;
            border-radius: 10px;
            padding: 20px;
            border: 1px solid #e2e8f0;
        }

        .panel h3 {
            color: #2d3748;
            margin-top: 0;
            border-bottom: 2px solid #4299e1;
            padding-bottom: 10px;
        }

        .button {
            background: linear-gradient(135deg, #4299e1, #3182ce);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.2s ease;
            margin: 5px;
        }

        .button:hover {
            background: linear-gradient(135deg, #3182ce, #2c5aa0);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(66, 153, 225, 0.3);
        }

        .button:disabled {
            background: #a0aec0;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .status {
            background: #e6fffa;
            border: 1px solid #4fd1c7;
            border-radius: 8px;
            padding: 15px;
            margin: 15px 0;
            color: #234e52;
        }

        .log {
            height: 200px;
            overflow-y: auto;
            background: #2d3748;
            color: #e2e8f0;
            padding: 15px;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            line-height: 1.4;
        }

        .log-entry {
            margin-bottom: 5px;
            padding: 2px 0;
        }

        .log-entry.error { color: #fc8181; }
        .log-entry.warn { color: #f6e05e; }
        .log-entry.info { color: #63b3ed; }

        .input-group {
            display: flex;
            gap: 10px;
            margin: 10px 0;
        }

        input[type="text"], input[type="number"] {
            flex: 1;
            padding: 10px;
            border: 1px solid #cbd5e0;
            border-radius: 6px;
            font-size: 14px;
        }

        input[type="text"]:focus, input[type="number"]:focus {
            outline: none;
            border-color: #4299e1;
            box-shadow: 0 0 0 3px rgba(66, 153, 225, 0.1);
        }

        .unit-info, .player-info {
            background: white;
            border-radius: 8px;
            padding: 15px;
            margin: 10px 0;
            border: 1px solid #e2e8f0;
        }

        .unit-info h4, .player-info h4 {
            margin-top: 0;
            color: #4a5568;
        }

        .stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin: 10px 0;
        }

        .stat {
            background: #f7fafc;
            padding: 8px;
            border-radius: 4px;
            text-align: center;
            font-weight: 600;
        }

        .connection-status {
            position: absolute;
            top: 20px;
            right: 20px;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 12px;
        }

        .connected {
            background: #c6f6d5;
            color: #22543d;
        }

        .disconnected {
            background: #fed7d7;
            color: #742a2a;
        }

        .connecting {
            background: #feebc8;
            color: #744210;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="connection-status disconnected" id="connectionStatus">Disconnected</div>

        <h1>🎮 Hexagonal RTS</h1>

        <div class="status" id="gameStatus">
            Welcome! Connect to a game server to begin playing.
        </div>

        <div class="controls">
            <div class="panel">
                <h3>🌐 Connection</h3>
                <div class="input-group">
                    <input type="text" id="serverUrl" placeholder="Server URL" value="ws://localhost:8080">
                    <button class="button" onclick="connect()">Connect</button>
                </div>
                <div class="input-group">
                    <input type="text" id="playerName" placeholder="Player Name" value="Player1">
                    <button class="button" onclick="joinGame()">Join Game</button>
                </div>
            </div>

            <div class="panel">
                <h3>⚔️ Game Actions</h3>
                <button class="button" onclick="endTurn()" disabled id="endTurnBtn">End Turn</button>
                <button class="button" onclick="spawnUnit()" disabled id="spawnUnitBtn">Spawn Warrior</button>
                <button class="button" onclick="saveGame()" disabled id="saveGameBtn">Save Game</button>
                <button class="button" onclick="loadGame()" disabled id="loadGameBtn">Load Game</button>
            </div>
        </div>

        <div class="game-board">
            <div class="hex-grid" id="gameBoard">
                <canvas id="gameCanvas" width="600" height="600"></canvas>
            </div>
        </div>

        <div class="controls">
            <div class="panel">
                <h3>👑 Players</h3>
                <div id="playersPanel">No players connected</div>
            </div>

            <div class="panel">
                <h3>🏰 Game Info</h3>
                <div id="gameInfoPanel">
                    <div class="stat">Turn: <span id="turnNumber">0</span></div>
                    <div class="stat">Phase: <span id="gamePhase">setup</span></div>
                </div>
            </div>
        </div>

        <div class="panel">
            <h3>📜 Game Log</h3>
            <div class="log" id="gameLog">
                <div class="log-entry info">Game client initialized</div>
            </div>
        </div>
    </div>

    <script>
        // Simple game client for testing
        class GameClient {
            constructor() {
                this.socket = null;
                this.gameState = null;
                this.playerId = null;
                this.isConnected = false;
            }

            connect(url) {
                this.log('Connecting to ' + url, 'info');
                this.updateConnectionStatus('connecting');

                try {
                    this.socket = new WebSocket(url);

                    this.socket.onopen = () => {
                        this.isConnected = true;
                        this.updateConnectionStatus('connected');
                        this.log('Connected to server', 'info');
                        this.updateGameStatus('Connected to server. Join the game to start playing.');
                    };

                    this.socket.onmessage = (event) => {
                        const message = JSON.parse(event.data);
                        this.handleMessage(message);
                    };

                    this.socket.onclose = () => {
                        this.isConnected = false;
                        this.updateConnectionStatus('disconnected');
                        this.log('Disconnected from server', 'warn');
                        this.updateGameStatus('Disconnected from server.');
                    };

                    this.socket.onerror = (error) => {
                        this.log('Connection error: ' + error, 'error');
                        this.updateConnectionStatus('disconnected');
                    };
                } catch (error) {
                    this.log('Failed to connect: ' + error.message, 'error');
                    this.updateConnectionStatus('disconnected');
                }
            }

            send(message) {
                if (this.isConnected && this.socket) {
                    this.socket.send(JSON.stringify(message));
                }
            }

            handleMessage(message) {
                switch (message.type) {
                    case 'gameState':
                        this.gameState = message.data;
                        this.updateUI();
                        break;
                    case 'playerJoined':
                        this.playerId = message.playerId;
                        this.log(`Joined as player: ${message.playerId}`, 'info');
                        this.updateGameStatus(`You joined as ${message.playerId}. Wait for your turn or start the game.`);
                        break;
                    case 'gameStarted':
                        this.log('Game started!', 'info');
                        this.updateGameStatus('Game has started! Play your turn when it\'s your time.');
                        break;
                    case 'turnChanged':
                        this.log(`Turn changed to player: ${message.currentPlayerId}`, 'info');
                        break;
                    case 'error':
                        this.log('Error: ' + message.message, 'error');
                        break;
                    default:
                        this.log('Received: ' + message.type, 'info');
                }
            }

            joinGame(playerName) {
                this.send({
                    type: 'joinGame',
                    playerName: playerName
                });
            }

            endTurn() {
                this.send({
                    type: 'gameAction',
                    data: {
                        id: 'action_' + Date.now(),
                        playerId: this.playerId,
                        type: 'endTurn',
                        timestamp: Date.now(),
                        data: {}
                    }
                });
            }

            spawnUnit() {
                const spawnX = Math.floor(Math.random() * 20);
                const spawnY = Math.floor(Math.random() * 20);

                this.send({
                    type: 'spawnUnit',
                    unitType: 'warrior',
                    position: { q: spawnX, r: spawnY }
                });
            }

            updateConnectionStatus(status) {
                const statusEl = document.getElementById('connectionStatus');
                statusEl.className = 'connection-status ' + status;
                statusEl.textContent = status.charAt(0).toUpperCase() + status.slice(1);
            }

            updateGameStatus(message) {
                document.getElementById('gameStatus').textContent = message;
            }

            updateUI() {
                if (!this.gameState) return;

                document.getElementById('turnNumber').textContent = this.gameState.turn || 0;
                document.getElementById('gamePhase').textContent = this.gameState.gamePhase || 'setup';

                const playersPanel = document.getElementById('playersPanel');
                if (this.gameState.players && this.gameState.players.length > 0) {
                    playersPanel.innerHTML = this.gameState.players.map(p =>
                        `<div class="player-info">
                            <h4>${p.name} ${p.id === this.gameState.currentPlayerId ? '👑' : ''}</h4>
                            <div>Resources: Gold ${p.resources?.gold || 0}</div>
                        </div>`
                    ).join('');
                }

                const isMyTurn = this.playerId === this.gameState.currentPlayerId;
                document.getElementById('endTurnBtn').disabled = !isMyTurn;
                document.getElementById('spawnUnitBtn').disabled = !isMyTurn;
                document.getElementById('saveGameBtn').disabled = !this.gameState;
                document.getElementById('loadGameBtn').disabled = !this.isConnected;

                this.drawGameBoard();
            }

            drawGameBoard() {
                const canvas = document.getElementById('gameCanvas');
                const ctx = canvas.getContext('2d');

                ctx.clearRect(0, 0, canvas.width, canvas.height);

                ctx.strokeStyle = '#cbd5e0';
                ctx.lineWidth = 1;

                for (let x = 0; x < 20; x++) {
                    for (let y = 0; y < 20; y++) {
                        const hexX = x * 25 + (y % 2 === 1 ? 12.5 : 0);
                        const hexY = y * 22;

                        if (hexX < canvas.width - 25 && hexY < canvas.height - 25) {
                            this.drawHex(ctx, hexX + 12, hexY + 12, 10);
                        }
                    }
                }

                if (this.gameState && this.gameState.units) {
                    for (const unit of this.gameState.units) {
                        const hexX = unit.position.q * 25 + (unit.position.r % 2 === 1 ? 12.5 : 0);
                        const hexY = unit.position.r * 22;

                        ctx.fillStyle = unit.playerId === this.playerId ? '#4299e1' : '#e53e3e';
                        ctx.beginPath();
                        ctx.arc(hexX + 12, hexY + 12, 6, 0, 2 * Math.PI);
                        ctx.fill();
                    }
                }
            }

            drawHex(ctx, x, y, size) {
                ctx.beginPath();
                for (let i = 0; i < 6; i++) {
                    const angle = (i * Math.PI) / 3;
                    const hexX = x + size * Math.cos(angle);
                    const hexY = y + size * Math.sin(angle);
                    if (i === 0) {
                        ctx.moveTo(hexX, hexY);
                    } else {
                        ctx.lineTo(hexX, hexY);
                    }
                }
                ctx.closePath();
                ctx.stroke();
            }

            log(message, level = 'info') {
                const logEl = document.getElementById('gameLog');
                const timestamp = new Date().toLocaleTimeString();
                const entry = document.createElement('div');
                entry.className = `log-entry ${level}`;
                entry.textContent = `[${timestamp}] ${message}`;
                logEl.appendChild(entry);
                logEl.scrollTop = logEl.scrollHeight;
            }
        }

        const gameClient = new GameClient();

        function connect() {
            const url = document.getElementById('serverUrl').value;
            gameClient.connect(url);
        }

        function joinGame() {
            const playerName = document.getElementById('playerName').value;
            if (playerName) {
                gameClient.joinGame(playerName);
            } else {
                gameClient.log('Please enter a player name', 'warn');
            }
        }

        function endTurn() {
            gameClient.endTurn();
            gameClient.log('Ended turn', 'info');
        }

        function spawnUnit() {
            gameClient.spawnUnit();
            gameClient.log('Attempted to spawn unit', 'info');
        }

        function saveGame() {
            const saveName = prompt('Enter save name:');
            if (saveName) {
                gameClient.send({
                    type: 'saveGame',
                    saveName: saveName
                });
                gameClient.log(`Requested save: ${saveName}`, 'info');
            }
        }

        function loadGame() {
            const saveId = prompt('Enter save ID to load:');
            if (saveId) {
                gameClient.send({
                    type: 'loadGame',
                    saveId: saveId
                });
                gameClient.log(`Requested load: ${saveId}`, 'info');
            }
        }

        document.getElementById('gameCanvas').addEventListener('click', function(event) {
            const rect = this.getBoundingClientRect();
            const x = event.clientX - rect.left;
            const y = event.clientY - rect.top;

            const hexQ = Math.floor(x / 25);
            const hexR = Math.floor(y / 22);

            gameClient.log(`Clicked hex: (${hexQ}, ${hexR})`, 'debug');

            if (gameClient.gameState && gameClient.playerId === gameClient.gameState.currentPlayerId) {
                gameClient.send({
                    type: 'gameAction',
                    data: {
                        id: 'action_' + Date.now(),
                        playerId: gameClient.playerId,
                        type: 'move',
                        timestamp: Date.now(),
                        data: {
                            unitId: 'selected_unit',
                            position: { q: hexQ, r: hexR }
                        }
                    }
                });
            }
        });

        document.addEventListener('DOMContentLoaded', function() {
            gameClient.log('HTML client loaded', 'info');
        });
    </script>
</body>
</html>
